name: 'Setup Android Build'
description: 'Configures JDK 17 (Temurin), validates the Gradle wrapper checksum, and sets up Gradle.'

inputs:
  cache-enabled:
    description: 'Whether to enable Gradle build/dependency caching (disabled for release jobs).'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Setup Gradle (cached)
      if: inputs.cache-enabled == 'true'
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Setup Gradle (no cache)
      if: inputs.cache-enabled != 'true'
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-disabled: true

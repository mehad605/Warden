name: Build & Release Warden

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'SemVer release tag (e.g. v2.0.0)'
        required: true
        type: string
        default: 'v2.0.0'
      dry_run:
        description: 'Build, verify, and upload workflow artifacts without signing or publishing a GitHub Release'
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve and validate deterministic SemVer version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.version_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: Release tag '$TAG' must match SemVer format vMAJOR.MINOR.PATCH (e.g. v2.0.0)" >&2
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Setup Android build environment
        uses: $/.github/actions/setup-android-build
        with:
          cache-enabled: 'false'

      - name: Run formatting, static analysis, lint, and unit tests
        run: ./gradlew ktlintCheck detekt lint testDebugUnitTest --no-daemon --stacktrace

  dry-run:
    name: Dry-Run Release Build & Verification
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android build environment
        uses: $/.github/actions/setup-android-build
        with:
          cache-enabled: 'false'

      - name: Build dry-run release APK and SBOM
        env:
          VERSION_NAME: ${{ needs.validate.outputs.version_name }}
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
        run: |
          ./gradlew assembleRelease generateReleaseSbom \
            --no-daemon \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE"

      - name: Stage, verify APK, and generate SHA-256 checksums
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION_NAME: ${{ needs.validate.outputs.version_name }}
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/Warden-release.apk "dist/Warden-${TAG}-dryrun.apk"
          cp app/build/outputs/sbom/Warden-release.cdx.json "dist/Warden-${TAG}.cdx.json"
          bash scripts/verify_release_apk.sh "dist/Warden-${TAG}-dryrun.apk" "$VERSION_NAME" "$VERSION_CODE"
          (cd dist && sha256sum "Warden-${TAG}-dryrun.apk" "Warden-${TAG}.cdx.json" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warden-release-dryrun-${{ needs.validate.outputs.tag }}
          path: dist/
          retention-days: 7

  release:
    name: Sign, Verify, Attest & Publish Release
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Android build environment
        uses: $/.github/actions/setup-android-build
        with:
          cache-enabled: 'false'

      - name: Decode signing keystore to temporary file
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing in the 'release' environment." >&2
            exit 1
          fi
          KS_FILE="$(mktemp "$RUNNER_TEMP/warden-keystore-XXXXXX.jks")"
          chmod 600 "$KS_FILE"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS_FILE"
          echo "path=$KS_FILE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK and SBOM
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ needs.validate.outputs.version_name }}
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
        run: |
          ./gradlew assembleRelease generateReleaseSbom \
            --no-daemon \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE"

      - name: Shred and delete temporary keystore
        if: always()
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
        run: |
          if [[ -n "$KEYSTORE_PATH" && -f "$KEYSTORE_PATH" ]]; then
            shred -u "$KEYSTORE_PATH" 2>/dev/null || rm -f "$KEYSTORE_PATH"
          fi

      - name: Stage, verify signed APK, and generate SHA-256 checksums
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION_NAME: ${{ needs.validate.outputs.version_name }}
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/Warden-release.apk "dist/Warden-${TAG}.apk"
          cp app/build/outputs/sbom/Warden-release.cdx.json "dist/Warden-${TAG}.cdx.json"
          bash scripts/verify_release_apk.sh "dist/Warden-${TAG}.apk" "$VERSION_NAME" "$VERSION_CODE"
          (cd dist && sha256sum "Warden-${TAG}.apk" "Warden-${TAG}.cdx.json" > SHA256SUMS.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/Warden-*.apk'

      - name: Create or update draft release, upload assets, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --title "Warden ${TAG}" \
              --generate-notes
          fi

          gh release upload "$TAG" \
            "dist/Warden-${TAG}.apk" \
            "dist/Warden-${TAG}.cdx.json" \
            "dist/SHA256SUMS.txt" \
            --clobber

          gh release edit "$TAG" --draft=false
